<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물병원 EMR 차트 관리</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 800px; margin: auto; background-color: #f8f9fa; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .input-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .input-field { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 15px; }
        .btn-group { display: flex; gap: 8px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-save { background-color: #0d6efd; color: white; }
        .btn-cancel { background-color: #6c757d; color: white; display: none; }
        
        .table-container { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 12px; border-bottom: 1px solid #dee2e6; }
        th { background-color: #e9ecef; color: #495057; font-size: 14px; text-align: center; }
        td { font-size: 14px; }
        .td-center { text-align: center; }
        .btn-action { padding: 6px 10px; font-size: 13px; border-radius: 4px; margin: 2px; flex: none; width: auto; }
        .btn-edit { background-color: #ffc107; color: #212529; }
        .btn-del { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

    <h2>🏥 동물병원 EMR 차트 관리</h2>

    <!-- 입력 및 수정 폼 -->
    <div class="input-card">
        <input type="hidden" id="record-id">
        <input type="text" id="patient-name" class="input-field" placeholder="환자명 (예: 뽀삐, 야옹이)">
        <input type="text" id="diagnosis" class="input-field" placeholder="진단 내용 및 처방 메모">
        <div class="btn-group">
            <button id="save-btn" class="btn-save" onclick="saveRecord()">차트 등록</button>
            <button id="cancel-btn" class="btn-cancel" onclick="resetForm()">취소</button>
        </div>
    </div>

    <!-- 차트 목록 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 12%;">NO</th>
                    <th style="width: 23%;">환자명</th>
                    <th style="width: 45%;">진단내용</th>
                    <th style="width: 20%;">관리</th>
                </tr>
            </thead>
            <tbody id="chart-list">
                <tr><td colspan="4" class="td-center">데이터를 불러오는 중입니다...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/records';

        // 1. Read (조회)
        async function loadRecords() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const list = document.getElementById('chart-list');
                list.innerHTML = '';

                if (!data || data.length === 0) {
                    list.innerHTML = '<tr><td colspan="4" class="td-center">등록된 진료 기록이 없습니다.</td></tr>';
                    return;
                }

                data.forEach(item => {
                    list.innerHTML += `
                        <tr>
                            <td class="td-center">${item.id}</td>
                            <td><strong>${escapeHtml(item.patient_name)}</strong></td>
                            <td>${escapeHtml(item.diagnosis)}</td>
                            <td class="td-center">
                                <button class="btn-action btn-edit" onclick="startEdit(${item.id}, '${escapeQuote(item.patient_name)}', '${escapeQuote(item.diagnosis)}')">수정</button>
                                <button class="btn-action btn-del" onclick="deleteRecord(${item.id})">삭제</button>
                            </td>
                        </tr>`;
                });
            } catch (err) {
                console.error("데이터 로드 실패:", err);
                document.getElementById('chart-list').innerHTML = '<tr><td colspan="4" class="td-center" style="color:red;">데이터 로딩 실패 (백엔드 오류)</td></tr>';
            }
        }

        // 2. Create / Update (생성 및 수정)
        async function saveRecord() {
            const id = document.getElementById('record-id').value;
            const patient_name = document.getElementById('patient-name').value.trim();
            const diagnosis = document.getElementById('diagnosis').value.trim();

            if (!patient_name || !diagnosis) {
                alert('환자명과 진단 내용을 모두 입력해주세요.');
                return;
            }

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ patient_name, diagnosis })
                });

                if (res.ok) {
                    resetForm();
                    loadRecords();
                } else {
                    alert('저장에 실패했습니다.');
                }
            } catch (err) {
                alert('서버 통신 오류가 발생했습니다.');
            }
        }

        // 3. Delete (삭제)
        async function deleteRecord(id) {
            if (!confirm(`[No.${id}] 진료 기록을 정말 삭제하시겠습니까?`)) return;

            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadRecords();
                } else {
                    alert('삭제에 실패했습니다.');
                }
            } catch (err) {
                alert('서버 통신 오류가 발생했습니다.');
            }
        }

        // 수정 모드 전환
        function startEdit(id, name, diag) {
            document.getElementById('record-id').value = id;
            document.getElementById('patient-name').value = name;
            document.getElementById('diagnosis').value = diag;
            
            const saveBtn = document.getElementById('save-btn');
            saveBtn.innerText = '수정 완료';
            saveBtn.style.backgroundColor = '#28a745';
            
            document.getElementById('cancel-btn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 폼 초기화
        function resetForm() {
            document.getElementById('record-id').value = '';
            document.getElementById('patient-name').value = '';
            document.getElementById('diagnosis').value = '';
            
            const saveBtn = document.getElementById('save-btn');
            saveBtn.innerText = '차트 등록';
            saveBtn.style.backgroundColor = '#0d6efd';
            
            document.getElementById('cancel-btn').style.display = 'none';
        }

        // 특수문자 탈출 (오류 방지)
        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        function escapeQuote(text) {
            return String(text).replace(/'/g, "\\'").replace(/"/g, "&quot;");
        }

        window.onload = loadRecords;
    </script>
</body>
</html>
