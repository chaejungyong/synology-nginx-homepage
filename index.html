<!DOCTYPE html>
<!-- 문서 종류를 HTML5로 지정합니다 -->
<html lang="ko">
<head>
    <!-- 문자 인코딩을 UTF-8로 설정하여 한글 깨짐을 방지합니다 -->
    <meta charset="UTF-8">
    <!-- 모바일 및 다양한 화면 크기에 맞추는 반응형 웹 설정입니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭에 표시될 웹페이지 제목입니다 -->
    <title>동물병원 EMR 차트 시스템</title>
    <style>
        /* 기본 배경색과 폰트, 여백을 설정합니다 */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        /* 중앙 정렬되는 메인 컨테이너 레이아웃입니다 */
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        /* 메인 제목 스타일입니다 */
        h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-top: 0; }
        /* 폼을 2개 컬럼으로 나눕니다 (입력창과 데이터 목록) */
        .grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; margin-top: 20px; }
        /* 각 섹션 카드 스타일입니다 */
        .card { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        /* 섹션 제목 스타일입니다 */
        .card h2 { margin-top: 0; font-size: 1.1rem; color: #34495e; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        /* 입력 폼 그룹 라벨 스타일입니다 */
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85rem; color: #555; }
        /* text, number, select, textarea 입력창 공통 스타일입니다 */
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        /* 입력 영역 높이 지정입니다 */
        textarea { height: 70px; resize: vertical; }
        /* 버튼 공통 디자인입니다 */
        button { width: 100%; background-color: #3498db; color: white; border: none; padding: 10px; margin-top: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        /* 버튼 마우스 오버 효과입니다 */
        button:hover { background-color: #2980b9; }
        /* 삭제 버튼 전용 붉은색 스타일입니다 */
        .btn-danger { background-color: #e74c3c; width: auto; padding: 5px 10px; margin-top: 0; font-size: 0.8rem; }
        /* 삭제 버튼 마우스 오버 효과입니다 */
        .btn-danger:hover { background-color: #c0392b; }
        /* 차트 목록 테이블 스타일입니다 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        /* 테이블 헤더 및 셀 테두리 설정입니다 */
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        /* 테이블 헤더 배경색입니다 */
        th { background-color: #f2f2f2; color: #333; }
        /* 진료 기록(SOAP) 내부 텍스트 스타일입니다 */
        .chart-note { white-space: pre-wrap; background: #fff; padding: 5px; border-radius: 3px; border: 1px solid #f0f0f0; }
    </style>
</head>
<body>

    <!-- 메인 레이아웃 시작 -->
    <div class="container">
        <!-- 시스템 타이틀 -->
        <h1>🐾 동물병원 간단 EMR 시스템</h1>

        <!-- 화면을 좌우 2컬럼으로 구분 -->
        <div class="grid">
            
            <!-- 왼쪽: 차트/환자 신규 입력 폼 -->
            <div class="card">
                <h2>신규 진료 기록 작성</h2>
                <!-- 차트 저장 폼입니다 -->
                <form id="emrForm">
                    <!-- 환자명 입력 -->
                    <label for="petName">환자 이름 (동물명)</label>
                    <input type="text" id="petName" placeholder="예: 뽀삐" required>

                    <!-- 축종 선택 -->
                    <label for="species">축종</label>
                    <select id="species">
                        <option value="개">개 (Canine)</option>
                        <option value="고양이">고양이 (Feline)</option>
                        <option value="토끼">토끼 (Rabbit)</option>
                        <option value="기타">기타</option>
                    </select>

                    <!-- 나이 및 체중 -->
                    <label for="age">나이 (살)</label>
                    <input type="number" id="age" placeholder="예: 3" required>

                    <label for="weight">체중 (kg)</label>
                    <input type="text" id="weight" placeholder="예: 4.5" required>

                    <!-- 보호자 연락처 -->
                    <label for="owner">보호자 성함 / 연락처</label>
                    <input type="text" id="owner" placeholder="홍길동 (010-0000-0000)" required>

                    <!-- 주요 증상 및 진료 기록(SOAP) -->
                    <label for="diagnosis">진료 및 처방 내용 (SOAP)</label>
                    <textarea id="diagnosis" placeholder="주소(CC), 청진, 체온, 처방 내용 등 입력" required></textarea>

                    <!-- 데이터 저장 버튼 -->
                    <button type="submit">차트 저장하기</button>
                </form>
            </div>

            <!-- 오른쪽: 저장된 차트 조회 및 검색 목록 -->
            <div class="card">
                <h2>차트 검색 및 조회</h2>
                <!-- 환자 이름 검색 입력창 -->
                <input type="text" id="searchInput" placeholder="환자 이름으로 검색..." onkeyup="searchChart()">

                <!-- 기록 표시 테이블 -->
                <table id="chartTable">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>환자(축종)</th>
                            <th>체중</th>
                            <th>진료 기록</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <!-- 자바스크립트로 동적 생성될 목록 영역 -->
                    <tbody id="chartList">
                        <!-- 데이터가 없거나 로드될 때 표시됨 -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- 스크립트 로직 시작 -->
    <script>
        // 페이지가 처음 로드될 때 실행되는 이벤트 리스너입니다
        document.addEventListener('DOMContentLoaded', loadCharts);

        // 폼 제출(차트 저장) 이벤트 처리 함수입니다
        document.getElementById('emrForm').addEventListener('submit', function(e) {
            // 폼 제출 시 페이지가 새로고침되는 기본 동작을 막습니다
            e.preventDefault();

            // 오늘 날짜와 시간을 YYYY-MM-DD HH:MM 형식으로 만듭니다
            const now = new Date();
            const dateString = now.getFullYear() + '-' + 
                               String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                               String(now.getDate()).padStart(2, '0') + ' ' + 
                               String(now.getHours()).padStart(2, '0') + ':' + 
                               String(now.getMinutes()).padStart(2, '0');

            // 입력 필드들의 값을 읽어와 하나의 객체(Object)로 모읍니다
            const chartData = {
                id: Date.now(), // 고유한 ID 값으로 현재 타임스탬프를 사용합니다
                date: dateString, // 생성 일시
                petName: document.getElementById('petName').value, // 환자 이름
                species: document.getElementById('species').value, // 축종
                age: document.getElementById('age').value, // 나이
                weight: document.getElementById('weight').value, // 체중
                owner: document.getElementById('owner').value, // 보호자 정보
                diagnosis: document.getElementById('diagnosis').value // 진료 내용
            };

            // 기존에 저장된 데이터 배열을 브라우저 localstorage에서 가져옵니다 (없으면 빈 배열)
            let charts = JSON.parse(localStorage.getItem('emr_charts')) || [];
            
            // 새로운 차트 객체를 데이터 배열 맨 앞에 추가합니다 (최신순 정렬)
            charts.unshift(chartData);

            // 업데이트된 배열을 JSON 문자열로 변환하여 localStorage에 저장합니다
            localStorage.setItem('emr_charts', JSON.stringify(charts));

            // 입력 완료 후 폼 요소를 초기화(빈칸으로 변경)합니다
            document.getElementById('emrForm').reset();

            // 화면의 차트 목록을 새로 업데이트합니다
            loadCharts();
        });

        // localStorage에서 차트 데이터를 불러와 화면에 출력하는 함수입니다
        function loadCharts() {
            // 저장된 목록을 가져옵니다
            const charts = JSON.parse(localStorage.getItem('emr_charts')) || [];
            
            // 테이블의 tbody 엘리먼트를 선택합니다
            const chartList = document.getElementById('chartList');
            
            // 기존 목록을 비웁니다
            chartList.innerHTML = '';

            // 저장된 차트가 없을 경우 안내 문구를 출력합니다
            if (charts.length === 0) {
                chartList.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888;">등록된 진료 기록이 없습니다.</td></tr>';
                return;
            }

            // 배열 내의 모든 차트 데이터를 반복문(forEach)으로 돌며 행(tr)을 생성합니다
            charts.forEach(function(chart) {
                // 새로운 테이블 행(tr)을 생성합니다
                const row = document.createElement('tr');
                
                // 행 내부의 셀(td) 내용들을 작성합니다
                row.innerHTML = `
                    <td><small>${chart.date}</small></td>
                    <td><strong>${chart.petName}</strong><br><small>(${chart.species} / ${chart.age}살)</small></td>
                    <td>${chart.weight} kg</td>
                    <td>
                        <div class="chart-note">${chart.diagnosis}</div>
                        <small style="color:#777;">보호자: ${chart.owner}</small>
                    </td>
                    <td>
                        <button class="btn-danger" onclick="deleteChart(${chart.id})">삭제</button>
                    </td>
                `;
                
                // 완성된 행을 tbody에 추가합니다
                chartList.appendChild(row);
            });
        }

        // 지정한 ID의 차트 기록을 삭제하는 함수입니다
        function deleteChart(id) {
            // 실수 삭제를 방지하기 위해 사용자 확인을 받습니다
            if (confirm('이 차트 기록을 정말 삭제하시겠습니까?')) {
                // 저장된 전체 목록을 불러옵니다
                let charts = JSON.parse(localStorage.getItem('emr_charts')) || [];
                
                // 선택한 ID와 다른 항목들만 남겨서 새로운 배열을 만듭니다 (필터링)
                charts = charts.filter(function(chart) {
                    return chart.id !== id;
                });

                // 삭제 처리된 배열을 다시 localStorage에 저장합니다
                localStorage.setItem('emr_charts', JSON.stringify(charts));

                // 화면을 갱신합니다
                loadCharts();
            }
        }

        // 환자 이름 검색 기능 함수입니다
        function searchChart() {
            // 검색 창에 입력된 텍스트를 대문자로 바꾸어 가져옵니다 (대소문자 구분 없이 검색)
            const filter = document.getElementById('searchInput').value.toUpperCase();
            
            // 테이블 행들을 가져옵니다
            const table = document.getElementById('chartTable');
            const tr = table.getElementsByTagName('tr');

            // 헤더(index 0)를 제외하고 전체 행을 순회합니다
            for (let i = 1; i < tr.length; i++) {
                // 환자 이름이 위치한 두 번째 열(td)을 가져옵니다
                const tdPet = tr[i].getElementsByTagName('td')[1];
                if (tdPet) {
                    // 셀의 텍스트 내용을 추출합니다
                    const txtValue = tdPet.textContent || tdPet.innerText;
                    
                    // 입력한 검색어가 텍스트에 포함되어 있으면 보이고, 없으면 감춥니다
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = '';
                    } else {
                        tr[i].style.display = 'none';
                    }
                }
            }
        }
    </script>
</body>
</html>
