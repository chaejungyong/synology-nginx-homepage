<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물병원 EMR 차트 관리</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 80px; resize: none; }
        button.btn-submit { width: 100%; padding: 12px; background-color: #003399; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.btn-submit:hover { background-color: #002266; }
        
        .search-box { margin-top: 25px; margin-bottom: 15px; display: flex; gap: 8px; }
        .search-box input { flex: 1; }
        .search-box button { padding: 0 16px; background-color: #555; color: white; border: none; border-radius: 6px; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #f8f9fa; color: #555; }
        .btn-del { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏥 동물병원 EMR 차트 관리</h2>
    
    <div class="form-group">
        <input type="text" id="patientName" placeholder="환자명 (예: 뽀삐, 야옹이)">
    </div>
    <div class="form-group">
        <textarea id="diagnosis" placeholder="진단 내용 및 처방 메모"></textarea>
    </div>
    <button class="btn-submit" onclick="addRecord()">차트 등록</button>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="검색할 환자명 입력" onkeyup="if(window.event.keyCode==13){fetchRecords()}">
        <button onclick="fetchRecords()">검색</button>
        <button onclick="clearSearch()" style="background-color: #888;">전체보기</button>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 15%;">NO</th>
                <th style="width: 25%;">환자명</th>
                <th style="width: 45%;">진단내용</th>
                <th style="width: 15%;">관리</th>
            </tr>
        </thead>
        <tbody id="recordTable">
            <tr><td colspan="4">데이터 로딩 중...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const API_BASE = '/api/records';

    async function fetchRecords() {
        const search = document.getElementById('searchInput').value.trim();
        const url = search ? `${API_BASE}?search=${encodeURIComponent(search)}` : API_BASE;
        
        try {
            const res = await fetch(url);
            const data = await res.json();
            const tbody = document.getElementById('recordTable');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">조회된 기록이 없습니다.</td></tr>';
                return;
            }

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.id}</td>
                    <td><strong>${row.patient_name}</strong></td>
                    <td style="text-align: left;">${row.diagnosis}</td>
                    <td><button class="btn-del" onclick="deleteRecord(${row.id})">삭제</button></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error(e);
        }
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        fetchRecords();
    }

    async function addRecord() {
        const patientName = document.getElementById('patientName').value.trim();
        const diagnosis = document.getElementById('diagnosis').value.trim();

        if (!patientName || !diagnosis) {
            alert('환자명과 진단내용을 입력해주세요.');
            return;
        }

        await fetch(API_BASE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ patient_name: patientName, diagnosis: diagnosis })
        });

        document.getElementById('patientName').value = '';
        document.getElementById('diagnosis').value = '';
        fetchRecords();
    }

    async function deleteRecord(id) {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
        fetchRecords();
    }

    fetchRecords();
</script>

</body>
</html>
