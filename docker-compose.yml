version: '3.8'

services:
  emr-db:
    image: mariadb:10.6
    container_name: emr-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mariadbpassword
      MYSQL_DATABASE: emr_db
      MYSQL_ROOT_HOST: '%'
    volumes:
      - ./db_data:/var/lib/mysql

  emr-backend:
    image: python:3.10-slim
    container_name: emr-backend
    restart: always
    ports:
      - "8080:5000"
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "pip install flask flask-cors pymysql && python app.py"
    depends_on:
      - emr-db